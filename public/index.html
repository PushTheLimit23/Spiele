<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiele</title>
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Farben wie Vier Gewinnt (helles Schema) */
  :root {
    --bg: #f4f1ea; --fg: #1d1d1f; --muted: #6b6b70; --card: #ffffff; --line: #ddd8cc;
    --accent: #41459e; --win: #2e8a6e; --loss: #c75c48;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px 32px; display: flex; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 8px 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 .dots { display: inline-flex; gap: 5px; }
  h1 .dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; font-size: 1.05rem; padding: .7em .9em; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0 8px; }
  .card {
    display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 14px; border-radius: 14px; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(30, 30, 40, .06); transition: transform .15s, box-shadow .15s;
  }
  .card:active { transform: scale(.98); }
  @media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 30, 40, .1); } }
  .card svg { width: 100%; height: auto; aspect-ratio: 16 / 10; display: block; border-radius: 9px; }
  .card b { font-size: 1.05rem; }
  .card span { font-size: .85rem; color: var(--muted); line-height: 1.35; }
  h2 { font-size: 1.15rem; margin: 26px 0 8px; }
  .pf-history { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .pf-history li { display: flex; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: .92rem; }
  .pf-history li:last-child { border-bottom: 0; }
  .pf-res { width: 6.5em; flex: none; font-weight: 600; }
  .pf-win .pf-res { color: var(--win); } .pf-loss .pf-res { color: var(--loss); } .pf-draw .pf-res { color: var(--muted); }
  .pf-opp { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .pf-date { color: var(--muted); flex: none; }
  .pf-empty { color: var(--muted); }
  @media (max-width: 340px) { .games { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1><span class="dots" aria-hidden="true"><i style="background:#41459e"></i><i style="background:#56bca6"></i><i style="background:#f2c35b"></i><i style="background:#c75c48"></i></span>Spiele</h1>
  <p class="lead">Spiel aussuchen, Link an einen Mitspieler schicken, los geht's.</p>

  <label for="name">Dein Name (gilt für alle Spiele)</label>
  <input id="name" maxlength="20" autocomplete="nickname" placeholder="Dein Name">

  <div class="games" id="games">
    <a class="card" href="/vier/">
      <svg viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#626669"/>
        <g fill="#f4f1ea"><circle cx="30" cy="22" r="10"/><circle cx="55" cy="22" r="10"/><circle cx="80" cy="22" r="10"/><circle cx="105" cy="22" r="10"/><circle cx="130" cy="22" r="10"/>
        <circle cx="30" cy="50" r="10"/><circle cx="55" cy="50" r="10"/><circle cx="105" cy="50" r="10"/><circle cx="130" cy="50" r="10"/><circle cx="130" cy="78" r="10"/></g>
        <circle cx="80" cy="50" r="10" fill="#56bca6"/><circle cx="30" cy="78" r="10" fill="#41459e"/><circle cx="55" cy="78" r="10" fill="#56bca6"/><circle cx="80" cy="78" r="10" fill="#41459e"/><circle cx="105" cy="78" r="10" fill="#41459e"/></svg>
      <b>Vier Gewinnt</b><span>Vier in einer Reihe gewinnt.</span>
    </a>
    <a class="card" href="/dame/">
      <svg viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#d8b98a"/>
        <g fill="#7a3a22"><rect x="0" y="0" width="20" height="20"/><rect x="40" y="0" width="20" height="20"/><rect x="80" y="0" width="20" height="20"/><rect x="120" y="0" width="20" height="20"/>
        <rect x="20" y="20" width="20" height="20"/><rect x="60" y="20" width="20" height="20"/><rect x="100" y="20" width="20" height="20"/><rect x="140" y="20" width="20" height="20"/>
        <rect x="0" y="40" width="20" height="20"/><rect x="40" y="40" width="20" height="20"/><rect x="80" y="40" width="20" height="20"/><rect x="120" y="40" width="20" height="20"/>
        <rect x="20" y="60" width="20" height="20"/><rect x="60" y="60" width="20" height="20"/><rect x="100" y="60" width="20" height="20"/><rect x="140" y="60" width="20" height="20"/>
        <rect x="0" y="80" width="20" height="20"/><rect x="40" y="80" width="20" height="20"/><rect x="80" y="80" width="20" height="20"/><rect x="120" y="80" width="20" height="20"/></g>
        <g fill="#3b2a20"><circle cx="30" cy="30" r="7"/><circle cx="70" cy="30" r="7"/><circle cx="110" cy="10" r="7"/></g>
        <g fill="#efe3c8"><circle cx="50" cy="70" r="7"/><circle cx="90" cy="50" r="7"/><circle cx="130" cy="70" r="7"/></g></svg>
      <b>Dame</b><span>Schlagpflicht, fliegende Dame.</span>
    </a>
    <a class="card" href="/muehle/">
      <svg viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#8a4a2c"/>
        <g fill="none" stroke="#f1e6d0" stroke-opacity=".75" stroke-width="2"><rect x="35" y="8" width="90" height="84"/><rect x="55" y="25" width="50" height="50"/><rect x="72" y="40" width="16" height="20"/>
        <path d="M80 8V40M80 60V92M35 50H72M88 50H125"/></g>
        <g fill="#efe3c8"><circle cx="35" cy="8" r="6"/><circle cx="80" cy="8" r="6"/><circle cx="125" cy="8" r="6"/></g>
        <g fill="#3b2a20"><circle cx="55" cy="75" r="6"/><circle cx="105" cy="25" r="6"/><circle cx="88" cy="60" r="6"/></g></svg>
      <b>Mühle</b><span>Drei in einer Linie – nimm einen Stein.</span>
    </a>
    <a class="card" href="/wort/">
      <svg viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#1f3a2e"/>
        <g fill="none" stroke="#f2efe6" stroke-width="2.4" stroke-linecap="round"><circle cx="48" cy="58" r="16"/><circle cx="102" cy="58" r="16"/><path d="M48 58L66 34H96L102 58M66 34L75 58H48M96 34L93 26H101"/><path d="M62 30H72"/></g>
        <text x="34" y="94" font-family="Georgia,serif" font-size="13" fill="#f2efe6" letter-spacing="3">F _ H R _ A D</text></svg>
      <b>Wortraten</b><span>Wort ausdenken, Buchstaben raten.</span>
    </a>
  </div>

  <div id="history" hidden></div>
</main>
<script src="/core.js"></script>
<script>
  const nameEl = document.getElementById('name');
  nameEl.value = Platform.store.get('spiele.name', '');
  nameEl.addEventListener('input', () => Platform.store.set('spiele.name', nameEl.value.trim().slice(0, 20)));
  // Historie über alle Spiele
  Platform.init('').renderHistory(document.getElementById('history'), { allGames: true, title: 'Deine letzten Partien', limit: 12 });
</script>
</body>
</html>
